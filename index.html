<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu Romo Aqui</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{background:#111;overflow:hidden}
  .app{max-width:430px;margin:0 auto;height:100vh;position:relative;background:white;overflow:hidden}

  /* ===== PANTALLA 1 - ASI COMO TE GUSTO ===== */
  #pantalla1{display:flex;flex-direction:column;height:100%}
  .header{
    height:28vh;position:relative;overflow:hidden;
    background:url('huevitos.jpg') center top / cover no-repeat;
  }
  .header h1{
    position:absolute;top:10px;left:90px;color:white;
    font-size:38px;text-shadow:2px 2px 4px #000;
  }
  .header p{
    position:absolute;top:55px;left:90px;color:yellow;
    font-weight:bold;font-size:15px;text-shadow:1px 1px 3px #000;
  }
  .verde{
    background:#00BE5A;color:white;text-align:center;
    padding:12px 10px 22px;position:relative;z-index:2;
  }
  .verde b{font-size:17px}
  .verde span{font-size:13px;display:block;margin-top:4px}
  .btn-llegar{
    position:absolute;left:50%;transform:translate(-50%,50%);
    bottom:0;background:white;border:none;
    padding:10px 28px;border-radius:30px;
    font-weight:bold;font-size:15px;cursor:pointer;z-index:5;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
  }
  #mapa1{flex:1;width:100%;z-index:1;cursor:pointer}
  .buscador{
    position:absolute;bottom:12px;left:12px;right:12px;z-index:10;
    background:white;border-radius:30px;padding:14px 18px;
    box-shadow:0 2px 10px rgba(0,0,0,.3);display:flex;gap:8px;
  }
  .buscador input{border:none;outline:none;width:100%;font-size:15px}

  /* ===== PANTALLA 2 - MAPA COMPLETO ===== */
  #pantalla2{display:none;height:100%;position:relative}
  #mapa2{height:100%;width:100%}
  .btn-atras{
    position:absolute;top:12px;left:12px;z-index:1000;
    background:white;border:none;padding:10px 16px;
    border-radius:30px;font-weight:bold;cursor:pointer;
  }
  .btn-llegar2{
    position:absolute;bottom:80px;left:50%;transform:translateX(-50%);
    z-index:1000;background:white;border:none;
    padding:12px 28px;border-radius:30px;font-weight:bold;cursor:pointer;
  }
</style>
</head>
<body>
<div class="app">

  <!-- PANTALLA 1 -->
  <div id="pantalla1">
    <div class="header">
      <h1>Tu Romo Aqui</h1>
      <p>Tu bebida mas cercano en RD</p>
    </div>
    <div class="verde">
      <b>TU LICORERIA MAS CERCANA</b>
      <span>El Punto Liquor Store - a 2.8 km - San Isidro</span>
      <button class="btn-llegar" onclick="comoLlegar()">Como llegar</button>
    </div>
    <div id="mapa1" onclick="abrirMapaCompleto()"></div>
  </div>

  <!-- PANTALLA 2 -->
  <div id="pantalla2">
    <div id="mapa2"></div>
    <button class="btn-atras" onclick="volver()">← Atras</button>
    <button class="btn-llegar2" onclick="comoLlegar()">Como llegar</button>
    <div class="buscador">🔍 <input placeholder="Buscar tienda, zona..."></div>
  </div>

  <div class="buscador" id="buscador1">🔍 <input placeholder="Buscar tienda, zona..."></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const lat = 18.4861, lng = -69.9312;

  let m1 = L.map('mapa1').setView([lat,lng], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(m1);
  L.marker([lat,lng]).addTo(m1).bindPopup("El Punto Liquor Store");

  let m2;
  function abrirMapaCompleto(){
    document.getElementById('pantalla1').style.display='none';
    document.getElementById('buscador1').style.display='none';
    document.getElementById('pantalla2').style.display='block';
    if(!m2){
      m2 = L.map('mapa2').setView([lat,lng], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(m2);
      L.marker([lat,lng]).addTo(m2).bindPopup("El Punto Liquor Store");
    }
    setTimeout(()=> m2.invalidateSize(), 200);
  }
  function volver(){
    document.getElementById('pantalla2').style.display='none';
    document.getElementById('pantalla1').style.display='flex';
    document.getElementById('buscador1').style.display='flex';
    setTimeout(()=> m1.invalidateSize(), 200);
  }
  function comoLlegar(){
    window.open('https://www.google.com/maps/dir/?api=1&destination='+lat+','+lng, '_blank');
  }
</script>
</body>
</html>
