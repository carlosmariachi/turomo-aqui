<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu Romo Aquí - Delivery en Santo Domingo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0f0f0f;color:white;padding-bottom:80px}
header{background:linear-gradient(135deg,#ff6b00,#ff9a00);padding:20px 16px}
header h1{font-size:26px;line-height:1}
header p{font-size:13px;opacity:.9;margin-top:4px}
.search{margin:14px 16px 0}
.search input{width:100%;padding:13px 16px;border-radius:12px;border:none;font-size:15px}
.cats{display:flex;gap:8px;overflow:auto;padding:12px 16px}
.cats button{white-space:nowrap;padding:9px 16px;border-radius:20px;border:1px solid #333;background:#1a1a1a;color:white}
.cats button.active{background:#ff6b00;border-color:#ff6b00}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.card{background:#1a1a1a;border-radius:14px;overflow:hidden}
.card .img{height:90px;background:#ff6b00;display:flex;align-items:center;justify-content:center;font-size:40px}
.card .info{padding:10px}
.card h3{font-size:14px}
.card p{font-size:11px;color:#aaa;margin:3px 0}
.card .hora{font-size:11px;color:#ffcc00}
.btn{display:block;background:#25D366;color:white;text-align:center;padding:10px;border-radius:9px;text-decoration:none;font-weight:bold;margin-top:8px;font-size:13px}
</style>
</head>
<body>
<header>
<h1>🥃 Tu Romo Aquí</h1>
<p>Delivery de bebidas en Santo Domingo • Abierto ahora</p>
</header>
<div class="search"><input id="buscador" placeholder="🔍 Buscar tienda, zona, bebida..."></div>
<div class="cats">
<button class="active" onclick="filtrar('todos',this)">Todos</button>
<button onclick="filtrar('Romo',this)">Romo</button>
<button onclick="filtrar('Cerveza',this)">Cerveza</button>
<button onclick="filtrar('Vino',this)">Vino</button>
</div>
<div class="grid" id="lista"></div>
<script>
let tiendas=[];
let filtro='todos';
fetch('tiendas.json').then(r=>r.json()).then(d=>{tiendas=d;mostrar();});
function mostrar(){
let q=document.getElementById('buscador').value.toLowerCase();
let html='';
tiendas.forEach(t=>{
if(filtro!=='todos' && !t.bebidas.includes(filtro)) return;
if(q && !(t.name.toLowerCase().includes(q)||t.zona.toLowerCase().includes(q))) return;
html+=`<div class="card"><div class="img">🥃</div><div class="info"><h3>${t.name}</h3><p>📍 ${t.zona}</p><p class="hora">🕐 ${t.hora}</p><p>${t.bebidas.join(' • ')}</p><a class="btn" href="https://wa.me/1${t.tel}?text=Hola%20quiero%20pedir%20en%20${encodeURIComponent(t.name)}">Pedir por WhatsApp</a></div></div>`;
});
document.getElementById('lista').innerHTML=html||'<p style="padding:20px">No hay tiendas con ese filtro</p>';
}
function filtrar(c,btn){filtro=c;document.querySelectorAll('.cats button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');mostrar();}
document.getElementById('buscador').addEventListener('input',mostrar);
</script>
</body>
</html>
