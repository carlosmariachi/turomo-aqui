<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Rincón del Borracho</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0f0f0f;color:#fff;padding:15px}
header{text-align:center;padding:20px 10px;background:#1a1a1a;border-radius:15px;margin-bottom:15px}
header h1{font-size:28px;color:#ffcc00}
header p{color:#aaa;margin-top:5px}
#buscador{width:100%;padding:14px;border-radius:10px;border:none;font-size:16px;margin-bottom:10px}
#btnUbicacion{width:100%;padding:14px;background:#ffcc00;color:#000;border:none;border-radius:10px;font-weight:bold;font-size:16px;margin-bottom:15px}
.tienda{background:#1e1e1e;border-radius:12px;padding:15px;margin-bottom:12px;border-left:4px solid #ffcc00}
.tienda h3{font-size:18px;color:#ffcc00}
.tienda p{font-size:14px;color:#ccc;margin:4px 0}
.dist{color:#4ade80;font-weight:bold}
.botones{display:flex;gap:8px;margin-top:10px}
.botones a{flex:1;text-align:center;padding:11px;border-radius:8px;text-decoration:none;font-weight:bold;font-size:14px}
.btn-mapa{background:#25D366;color:#fff}
.btn-llamar{background:#fff;color:#000}
.btn-ws{background:#128C7E;color:#fff}
#contador{text-align:center;color:#aaa;margin-bottom:10px}
</style>
</head>
<body>
<header>
<h1>🥴 El Rincón del Borracho</h1>
<p>Tu romo a la vuelta de la esquina</p>
</header>
<input id="buscador" placeholder="🔍 Busca: Charles de Gaulle, San Vicente, Drinks 2 Go...">
<button id="btnUbicacion">📍 Usar mi ubicación</button>
<div id="contador"></div>
<div id="lista">Cargando tiendas...</div>
<script>
let tiendas=[];
let miLat=null, miLng=null;
function distKm(lat1,lon1,lat2,lon2){
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function mostrar(){
  const q=document.getElementById('buscador').value.toLowerCase();
  let filtradas=tiendas.filter(t=>(t.nombre+' '+t.zona).toLowerCase().includes(q));
  filtradas=filtradas.map(t=>{
    let d=null;
    if(miLat) d=distKm(miLat,miLng,t.lat,t.lng);
    return {...t, d};
  });
  if(miLat) filtradas.sort((a,b)=>a.d-b.d);
  document.getElementById('contador').innerText=filtradas.length+' tiendas encontradas';
  document.getElementById('lista').innerHTML=filtradas.map(t=>{
    const tel=(t.telefono||'').replace(/[^0-9]/g,'');
    const wsLink='https://wa.me/1'+tel+'?text='+encodeURIComponent('Hola, quiero pedir un romo en '+t.nombre);
    const mapaLink='https://www.google.com/maps/search/?api=1&query='+t.lat+','+t.lng;
    return `<div class="tienda">
      <h3>${t.nombre}</h3>
      <p>📍 ${t.zona}</p>
      <p>🕒 ${t.horario||''}</p>
      <p>📞 ${t.telefono||''}</p>
      ${t.d!=null?`<p class="dist">📍 A ${t.d.toFixed(1)} km de ti</p>`:''}
      <div class="botones">
        <a class="btn-mapa" href="${mapaLink}" target="_blank">🗺️ Cómo llegar</a>
        <a class="btn-llamar" href="tel:+1${tel}">📞 Llamar</a>
        <a class="btn-ws" href="${wsLink}" target="_blank">💬 WhatsApp</a>
      </div>
    </div>`;
  }).join('') || '<p style="text-align:center">No hay resultados</p>';
}
fetch('tiendas.json?v=105').then(r=>r.json()).then(d=>{tiendas=d;mostrar();}).catch(()=>{document.getElementById('lista').innerHTML='Error cargando tiendas';});
document.getElementById('buscador').addEventListener('input',mostrar);
document.getElementById('btnUbicacion').addEventListener('click',()=>{
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(p=>{miLat=p.coords.latitude;miLng=p.coords.longitude;mostrar();},()=>{alert('Activa tu ubicación');});
  } else {alert('Tu celular no permite ubicación');}
});
</script>
</body>
</html>
