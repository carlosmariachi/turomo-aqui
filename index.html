<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu Romo Aquí</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f5f5f5}
header{background:#ff6b00;color:white;padding:15px;text-align:center}
header h1{font-size:22px}
header p{font-size:13px;opacity:.9}
#buscador{width:90%;padding:12px;margin:12px auto;display:block;border-radius:10px;border:1px solid #ddd;font-size:15px}
#lista{padding:0 12px 20px}
.tienda{background:white;padding:14px;border-radius:12px;margin-bottom:10px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.tienda h3{font-size:17px}
.tienda p{font-size:13px;color:#555;margin-top:4px}
.tienda a{display:inline-block;margin-top:8px;background:#00c853;color:white;padding:8px 14px;border-radius:20px;text-decoration:none;font-weight:bold;font-size:14px}
</style>
</head>
<body>
<header>
<h1>🥃 Tu Romo Aquí</h1>
<p>Licorerías cerca de ti en Santo Domingo</p>
</header>
<input id="buscador" placeholder="Buscar licorería...">
<div id="lista"></div>
<script>
const tiendas=[
{name:"Licorería El Primo", zona:"Los Alcarrizos", tel:"809-555-0101"},
{name:"Super Colmado La Fe", zona:"Santo Domingo Norte", tel:"809-555-0102"},
{name:"Licor Store Central", zona:"Santo Domingo Este", tel:"809-555-0103"},
{name:"Colmado El Brindis", zona:"Villa Mella", tel:"809-555-0104"}
];
const lista=document.getElementById('lista');
const buscador=document.getElementById('buscador');
function mostrar(filtro=""){
lista.innerHTML="";
tiendas.filter(t=>t.name.toLowerCase().includes(filtro.toLowerCase())||t.zona.toLowerCase().includes(filtro.toLowerCase())).forEach(t=>{
lista.innerHTML+=`<div class="tienda"><h3>🥃 ${t.name}</h3><p>📍 ${t.zona}</p><p>📞 ${t.tel}</p><a href="tel:${t.tel}">Llamar</a></div>`;
});
}
buscador.addEventListener('input',e=>mostrar(e.target.value));
mostrar();
</script>
</body>
</html>
