<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu Romo Aquí - Mapa</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{height:100vh;display:flex;flex-direction:column;background:#111}
header{background:#ff6b00;color:white;padding:12px 14px;z-index:1000}
header h1{font-size:22px} header p{font-size:12px;opacity:.9}
#search{width:100%;padding:11px 12px;border:none;border-radius:10px;margin-top:8px;font-size:15px;outline:none}
#filters{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
#filters button{white-space:nowrap;border:none;background:rgba(255,255,255,.25);color:white;padding:7px 14px;border-radius:20px;font-weight:700}
#filters button.on{background:white;color:#ff6b00}
#map{flex:1;width:100%;z-index:1;min-height:300px}
#lista{max-height:38vh;overflow-y:auto;background:#111;padding:10px}
.card{background:#1e1e1e;color:white;border-radius:14px;padding:12px;margin-bottom:10px;border:1px solid #333}
.card h3{font-size:16px} .card p{font-size:13px;color:#bbb;margin:4px 0}
.badge{background:#ff6b00;color:white;font-size:11px;padding:3px 8px;border-radius:20px}
.btn{display:block;text-align:center;padding:11px;border-radius:10px;font-weight:800;text-decoration:none;margin-top:8px}
.wa{background:#25D366;color:white} .ruta{background:#4285F4;color:white}
.dist{color:#4ade80;font-weight:700;font-size:13px}
#cercanaBanner{display:none;background:#00c853;color:white;padding:12px 14px;text-align:center;z-index:1000}
#cercanaBanner h2{font-size:17px}
#cercanaBanner p{font-size:13px;margin:4px 0}
#cercanaBanner a{display:inline-block;background:white;color:#00c853;padding:8px 16px;border-radius:20px;font-weight:800;text-decoration:none;margin-top:6px}
</style>
</head>
<body>
<header>
<h1>🥃 Tu Romo Aquí</h1>
<p>📍 Licorerías cerca de ti en Santo Domingo</p>
<input id="search" placeholder="🔍 Buscar tienda, zona, bebida...">
<div id="filters">
<button class="on" data-f="Todos">Todos</button>
<button data-f="Romo">Romo</button>
<button data-f="Cerveza">Cerveza</button>
<button data-f="Vino">Vino</button>
<button data-f="Cercana">📍 Más Cercana</button>
</div>
</header>
<div id="cercanaBanner"></div>
<div id="map"></div>
<div id="lista"><p style="color:#aaa;text-align:center;padding:15px">Cargando mapa y tiendas...</p></div>
<script>
let map = L.map('map').setView([18.4861,-69.9312],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
let tiendas=[], markers=[], userLat=null, userLng=null, filtro='Todos', busqueda='';
function distKm(lat1,lon1,lat2,lon2){let R=6371,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180;let a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
function mostrarCercana(){
  if(!userLat || !tiendas.length) return;
  let cercana = [...tiendas].sort((a,b)=>distKm(userLat,userLng,a.lat,a.lng)-distKm(userLat,userLng,b.lat,b.lng))[0];
  let d = distKm(userLat,userLng,cercana.lat,cercana.lng).toFixed(1);
  let banner = document.getElementById('cercanaBanner');
  banner.style.display='block';
  banner.innerHTML = `<h2>⭐ TU LICORERÍA MÁS CERCANA ES ESTA 👇</h2><p><b>${cercana.name}</b> • 📍 ${cercana.zona} • A solo <b>${d} km de ti</b></p><a href="https://www.google.com/maps/dir/?api=1&destination=${cercana.lat},${cercana.lng}" target="_blank">🧭 CÓMO LLEGAR AHORA</a>`;
  map.setView([cercana.lat,cercana.lng],14);
}
function render(){
  markers.forEach(m=>map.removeLayer(m)); markers=[];
  let lista = tiendas.filter(t=>{
    if(filtro!=='Todos' && filtro!=='Cercana' && !t.bebidas.includes(filtro)) return false;
    if(busqueda && !(t.name+' '+t.zona+' '+t.bebidas.join(' ')).toLowerCase().includes(busqueda)) return false;
    return true;
  });
  if(filtro==='Cercana' && userLat){ lista.sort((a,b)=>distKm(userLat,userLng,a.lat,a.lng)-distKm(userLat,userLng,b.lat,b.lng)); lista=lista.slice(0,5); }
  document.getElementById('lista').innerHTML = lista.length? '' : '<p style="color:white;text-align:center;padding:20px">No hay tiendas con ese filtro</p>';
  lista.forEach(t=>{
    let d = userLat? distKm(userLat,userLng,t.lat,t.lng).toFixed(1)+' km de ti' : '';
    let m = L.marker([t.lat,t.lng]).addTo(map).bindPopup(`<b>${t.name}</b><br>${t.zona}<br>${d}`);
    markers.push(m);
    document.getElementById('lista').innerHTML += `<div class="card"><h3>🥃 ${t.name} <span class="badge">${d||t.zona}</span></h3><p>📍 ${t.zona} • 🕐 ${t.hora}</p><p>${t.bebidas.map(b=>'🍺 '+b).join(' ')}</p><p class="dist">${d? '📍 Estás a '+d+' • ':''}</p><a class="btn wa" href="https://wa.me/1${t.tel}?text=${encodeURIComponent('Hola '+t.name+', quiero pedir un romo a domicilio')}" target="_blank">💬 Pedir por WhatsApp</a><a class="btn ruta" href="https://www.google.com/maps/dir/?api=1&destination=${t.lat},${t.lng}" target="_blank">🧭 Cómo Llegar - Ruta Más Cercana</a></div>`;
  });
}
fetch('tiendas.json').then(r=>r.json()).then(d=>{tiendas=d;render();mostrarCercana();});
document.getElementById('search').addEventListener('input',e=>{busqueda=e.target.value.toLowerCase();render();});
document.querySelectorAll('#filters button').forEach(b=>{b.onclick=()=>{document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('on'));b.classList.add('on');filtro=b.dataset.f;render();}});
if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>{
  userLat=p.coords.latitude; userLng=p.coords.longitude;
  map.setView([userLat,userLng],14);
  L.circleMarker([userLat,userLng],{radius:10,color:'#4285F4',fillColor:'#4285F4',fillOpacity:1}).addTo(map).bindPopup('📍 Tú estás aquí');
  render(); mostrarCercana();
},()=>{alert('Activa tu ubicación para ver la licorería más cercana');});}
</script>
</body>
</html>
