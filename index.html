<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu Romo Aquí</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f5f5f5}
header{background:#ff6b00;color:white;padding:15px;text-align:center}
header h1{font-size:22px}
header p{font-size:12px;margin-top:3px}
header img{width:80px;height:80px;border-radius:50%;object-fit:cover;margin-top:8px}
.banner{background:#00c853;color:white;text-align:center;padding:12px}
.banner h2{font-size:15px}
.banner p{font-size:13px;margin:6px 0}
.banner .abierto{font-weight:bold}
.banner a{display:block;background:white;color:#00c853;text-decoration:none;padding:10px;border-radius:20px;font-weight:bold;margin-top:8px}
#map{height:450px;width:100%}
.marcador{font-size:32px;text-align:center;line-height:1}
.marcador-borracho{font-size:38px}
.titilando{animation:titila 1s infinite}
@keyframes titila{0%{transform:scale(1);opacity:1}50%{transform:scale(1.2);opacity:0.7}100%{transform:scale(1);opacity:1}}
.btn-ubicacion{background:#ff6b00;color:white;border:none;padding:10px 15px;border-radius:20px;font-weight:bold;margin-top:8px;width:100%;font-size:14px}
</style>
</head>
<body>
<header>
<div>
<h1>🍷 Tu Romo Aquí</h1>
<p>Licorerías cerca de ti en Santo Domingo</p>
<img src="IMG_7927.jpeg">
</div>
</header>
<div class="banner">
<h2>⭐ TU LICORERÍA MÁS CERCANA</h2>
<p id="cercaTexto">Cargando...</p>
<p class="abierto" id="horarioTexto">🟢 Buscando horario...</p>
<a id="comoLlegar" href="#" target="_blank">📍 CÓMO LLEGAR</a>
<button class="btn-ubicacion" onclick="pedirUbicacion()">📍 USAR MI UBICACIÓN</button>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var map = L.map('map').setView([18.49,-69.86],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
var iconoBotella = L.divIcon({className:'', html:'<div class="marcador">🍾</div>', iconSize:[32,32]});
var iconoBotellaCercana = L.divIcon({className:'', html:'<div class="marcador titilando">🍾</div>', iconSize:[32,32]});
var iconoBorracho = L.divIcon({className:'', html:'<div class="marcador-borracho">🥴</div>', iconSize:[38,38]});
function distKm(lat1,lng1,lat2,lng2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
// TUS 3 TIENDAS DE RESPALDO - YA ESTAN ADENTRO, NO DEPENDEN DE tiendas.json
var TIENDAS_RESPALDO = [
  {nombre:"El Punto Liquor Store", zona:"Aut. San Isidro, Santo Domingo Este - Frente Hotel Golden House", lat:18.485748, lng:-69.843905, horario:"ABIERTO - Cierra 12:05 a.m. | Abre 9:30 a.m.", telefono:"809-596-2640"},
  {nombre:"On Time Liquor Store - Charles de Gaulle", zona:"Av. Charles de Gaulle, al lado de Shell, Santo Domingo Este", lat:18.492535, lng:-69.824343, horario:"Abierto - Cierra a las 12 a.m.", telefono:"809-576-7665"},
  {nombre:"Mega Drinks - San Vicente", zona:"Av. San Vicente de Paúl 2-328, Santo Domingo Este", lat:18.494181, lng:-69.851282, horario:"Abierto - Cierra a las 11 p.m.", telefono:"809-594-7778"}
];
function normalizar(t){
  return {
    nombre: t.nombre || 'Licorería',
    lat: parseFloat(t.lat),
    lng: parseFloat(t.lng),
    direccion: t.zona || t.direccion || '',
    horario: t.horario || 'Ver horario en tienda',
    telefono: t.telefono || ''
  };
}
var tiendas = [];
var marcadores = [];
var miUbicacion = null;
function dibujarTiendas(){
  marcadores.forEach(m=>map.removeLayer(m));
  marcadores = [];
  tiendas.forEach((ti)=>{
    var m = L.marker([ti.lat,ti.lng], {icon: iconoBotella}).addTo(map);
    m.bindPopup('<b>'+ti.nombre+'</b><br>'+ti.direccion+'<br>'+ti.horario+'<br>'+ti.telefono);
    marcadores.push(m);
  });
}
function mostrarCercana(lat,lng){
  if(!tiendas || tiendas.length===0){
    // SI NO HAY TIENDAS, USA LAS DE RESPALDO DE UNA VEZ
    tiendas = TIENDAS_RESPALDO.map(normalizar);
    dibujarTiendas();
  }
  let mejorIndex=0, mejorD=9999, mejor=tiendas[0];
  tiendas.forEach((t,i)=>{
    let d=distKm(lat,lng,t.lat,t.lng);
    if(d<mejorD){mejorD=d;mejorIndex=i;mejor=t;}
  });
  document.getElementById('cercaTexto').innerText = 'La más cerca: ' + mejor.nombre + ' - a ' + mejorD.toFixed(2) + ' km - ' + mejor.direccion;
  document.getElementById('horarioTexto').innerText = mejor.horario + (mejor.telefono ? ' | 📞 ' + mejor.telefono : '');
  document.getElementById('comoLlegar').href = 'https://www.google.com/maps/dir/?api=1&destination=' + mejor.lat + ',' + mejor.lng;
  marcadores.forEach((m,i)=>{
    if(i===mejorIndex){ m.setIcon(iconoBotellaCercana); } else { m.setIcon(iconoBotella); }
  });
  map.setView([lat,lng],13);
  if(miUbicacion){ map.removeLayer(miUbicacion); }
  miUbicacion = L.marker([lat,lng], {icon: iconoBorracho}).addTo(map);
}
function pedirUbicacion(){
  document.getElementById('cercaTexto').innerText = 'Buscando tu ubicación...';
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      p=>mostrarCercana(p.coords.latitude, p.coords.longitude),
      ()=>mostrarCercana(18.49,-69.86),
      {timeout:5000, maximumAge:60000}
    );
  } else { mostrarCercana(18.49,-69.86); }
  setTimeout(()=>{
    let texto = document.getElementById('cercaTexto').innerText;
    if(texto.includes('Buscando')){ mostrarCercana(18.49,-69.86); }
  }, 6000);
}
// 1. Primero muestra las de respaldo para que NUNCA se quede en "Cargando"
tiendas = TIENDAS_RESPALDO.map(normalizar);
dibujarTiendas();
pedirUbicacion();
// 2. Después intenta cargar tu tiendas.json por si agregaste más tiendas
fetch('tiendas.json').then(r=>r.json()).then(datos=>{
  if(Array.isArray(datos) && datos.length>0){
    tiendas = datos.map(normalizar).filter(t=>!isNaN(t.lat) && !isNaN(t.lng));
    if(tiendas.length>0){
      dibujarTiendas();
      pedirUbicacion();
    }
  }
}).catch(()=>{});
</script>
</body>
</html>
