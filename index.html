<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu Romo Aquí - Delivery en Santo Domingo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{background:#0f0f0f;color:white;padding-bottom:110px}
header{background:linear-gradient(135deg,#ff6b00,#ff2d55);padding:20px 16px 16px;position:sticky;top:0;z-index:10}
header h1{font-size:26px;line-height:1}
header p{font-size:13px;opacity:.9;margin-top:4px}
.badge{display:inline-block;background:white;color:#111;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;margin-top:8px}
.search{margin:14px 16px 0}
.search input{width:100%;padding:13px 16px;border-radius:14px;border:none;background:#1f1f1f;color:white;font-size:15px;outline:none}
.cats{display:flex;gap:8px;overflow-x:auto;padding:14px 16px}
.cats button{white-space:nowrap;padding:9px 16px;border-radius:20px;border:1px solid #333;background:#1f1f1f;color:white;font-size:13px}
.cats button.active{background:#ff6b00;border-color:#ff6b00}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.card{background:#1c1c1c;border-radius:16px;overflow:hidden}
.card img{width:100%;height:130px;object-fit:cover}
.card-body{padding:10px}
.card-body h3{font-size:14px;line-height:1.2;min-height:34px}
.card-body p{font-size:12px;color:#aaa;margin:4px 0}
.price{font-weight:800;font-size:16px;color:#ffcc00}
.add{width:100%;margin-top:8px;background:#ff6b00;color:white;border:none;padding:10px;border-radius:10px;font-weight:700;font-size:13px}
.cart-bar{position:fixed;bottom:0;left:0;right:0;background:#1c1c1c;border-top:1px solid #333;padding:12px 16px 20px}
.cart-bar button{width:100%;background:#25D366;color:white;border:none;padding:15px;border-radius:14px;font-size:16px;font-weight:800}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:flex-end;z-index:99}
.modal-box{background:#1c1c1c;width:100%;border-radius:20px 20px 0 0;padding:20px;max-height:85vh;overflow:auto}
.item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #333}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:none;background:#2a2a2a;color:white;margin-top:8px;font-size:14px}
</style>
</head>
<body>

<header>
<h1>🥃 Tu Romo Aquí</h1>
<p>Delivery de bebidas frías en Santo Domingo • 24/7</p>
<span class="badge">⚡ Entrega en 30-45 min</span>
<span class="badge">❄️ Bien frío</span>
</header>

<div class="search"><input id="buscador" placeholder="🔍 Busca tu romo... ej: Brugal, Presidente..."></div>
<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>

<div class="cart-bar">
<button onclick="abrirCarrito()">🛒 Ver Carrito (<span id="count">0</span>) • RD$ <span id="total">0</span></button>
</div>

<div id="modal"><div class="modal-box">
<h2>Tu Pedido</h2>
<div id="lista"></div>
<input id="nombre" placeholder="Tu nombre">
<input id="telefono" placeholder="Tu WhatsApp">
<textarea id="direccion" placeholder="Tu dirección completa + referencia"></textarea>
<select id="pago"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta al entregar</option></select>
<p style="margin-top:10px;font-size:13px;color:#aaa">Envío: RD$ 150 • Gratis en pedidos + RD$ 2,000</p>
<h3 style="margin-top:10px">Total a pagar: RD$ <span id="total2">0</span></h3>
<button onclick="pedir()" style="width:100%;background:#25D366;color:white;border:none;padding:15px;border-radius:14px;font-weight:800;margin-top:12px;font-size:16px">📲 Pedir por WhatsApp</button>
<button onclick="cerrar()" style="width:100%;background:#333;color:white;border:none;padding:12px;border-radius:12px;margin-top:8px">Cerrar</button>
</div></div>

<script>
const productos=[
{id:1,nombre:"Brugal XV 750ml",cat:"Ron",precio:1150,img:"https://images.unsplash.com/photo-1569525387638-b5e43c48ec0e?w=600"},
{id:2,nombre:"Brugal 1888 750ml",cat:"Ron",precio:2450,img:"https://images.unsplash.com/photo-1614313511387-1436a4480ebb?w=600"},
{id:3,nombre:"Barceló Imperial 750ml",cat:"Ron",precio:1650,img:"https://images.unsplash.com/photo-1584225064785-c62a8b43d148?w=600"},
{id:4,nombre:"Barceló Añejo 1L",cat:"Ron",precio:850,img:"https://images.unsplash.com/photo-1572116469696-31de0f17cc34?w=600"},
{id:5,nombre:"Presidente Light 12oz x6",cat:"Cerveza",precio:650,img:"https://images.unsplash.com/photo-1535958636474-b021ee887b13?w=600"},
{id:6,nombre:"Presidente Black 12oz x6",cat:"Cerveza",precio:750,img:"https://images.unsplash.com/photo-1571613316887-6f8d5cbf7ef7?w=600"},
{id:7,nombre:"Corona Extra x6",cat:"Cerveza",precio:950,img:"https://images.unsplash.com/photo-1600788886242-5c96aabe3757?w=600"},
{id:8,nombre:"Heineken x6",cat:"Cerveza",precio:900,img:"https://images.unsplash.com/photo-1618885472179-5e4747a1e2e6?w=600"},
{id:9,nombre:"J&W Black Label 750ml",cat:"Whisky",precio:3200,img:"https://images.unsplash.com/photo-1569525387638-b5e43c48ec0e?w=600"},
{id:10,nombre:"Old Parr 12 Años 750ml",cat:"Whisky",precio:2850,img:"https://images.unsplash.com/photo-1527281400683-1aae777175f8?w=600"},
{id:11,nombre:"Smirnoff Vodka 750ml",cat:"Vodka",precio:950,img:"https://images.unsplash.com/photo-1614313511387-1436a4480ebb?w=600"},
{id:12,nombre:"Hielo 5lb",cat:"Extras",precio:150,img:"https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?w=600"},
];
let filtro="Todos",carrito={};
const cats=["Todos","Ron","Cerveza","Whisky","Vodka","Extras"];
document.getElementById('cats').innerHTML=cats.map(c=>`<button class="${c==='Todos'?'active':''}" onclick="filtrar('${c}',this)">${c}</button>`).join('');
function filtrar(c,btn){filtro=c;document.querySelectorAll('.cats button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();}
function render(){
let lista=productos.filter(p=>(filtro==="Todos"||p.cat===filtro)&&p.nombre.toLowerCase().includes(document.getElementById('buscador').value.toLowerCase()));
document.getElementById('grid').innerHTML=lista.map(p=>`
<div class="card"><img src="${p.img}"><div class="card-body"><h3>${p.nombre}</h3><p>${p.cat} • En stock</p><div class="price">RD$ ${p.precio.toLocaleString()}</div><button class="add" onclick="add(${p.id})">+ Agregar</button></div></div>`).join('');
}
document.getElementById('buscador').addEventListener('input',render);
function add(id){carrito[id]=(carrito[id]||0)+1;actualizar();}
function actualizar(){let c=0,t=0;for(let id in carrito){c+=carrito[id];let p=productos.find(x=>x.id==id);t+=p.precio*carrito[id];}document.getElementById('count').innerText=c;document.getElementById('total').innerText=t.toLocaleString();let envio=t>=2000||t==0?0:150;document.getElementById('total2').innerText=(t+envio).toLocaleString();}
function abrirCarrito(){document.getElementById('modal').style.display='flex';mostrar();}
function cerrar(){document.getElementById('modal').style.display='none';}
function mostrar(){let h='';for(let id in carrito){let p=productos.find(x=>x.id==id);h+=`<div class="item"><span>${p.nombre} x${carrito[id]}</span><b>RD$ ${(p.precio*carrito[id]).toLocaleString()}</b></div>`;}document.getElementById('lista').innerHTML=h||'Carrito vacío';}
function pedir(){
let nombre=document.getElementById('nombre').value, tel=document.getElementById('telefono').value, dir=document.getElementById('direccion').value;
if(!nombre||!dir){alert('Pon tu nombre y dirección');return;}
let msg=`🥃 NUEVO PEDIDO - TU ROMO AQUÍ%0A%0A👤 ${nombre}%0A📱 ${tel}%0A📍 ${dir}%0A💳 Pago: ${document.getElementById('pago').value}%0A%0A--- PEDIDO ---%0A`;
for(let id in carrito){let p=productos.find(x=>x.id==id);msg+=`• ${p.nombre} x${carrito[id]} = RD$ ${(p.precio*carrito[id]).toLocaleString()}%0A`;}
msg+=`%0A💰 Total: RD$ ${document.getElementById('total2').innerText}`;
window.open(`https://wa.me/18090000000?text=${msg}`,'_blank');
}
render();actualizar();
</script>
</body>
</html>
