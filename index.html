html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu Romo Aquí - Mapa</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{height:100vh;display:flex;flex-direction:column}
header{background:#ff6b00;color:white;padding:12px}
header h1{font-size:22px} header p{font-size:12px;opacity:.9}
#search{width:100%;padding:11px 12px;border:none;border-radius:10px;margin-top:10px;font-size:15px}
#filters{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
#filters button{white-space:nowrap;border:none;background:white;color:#333;padding:8px 14px;border-radius:20px;font-weight:700}
#filters button.on{background:#333;color:#ff6b00}
#map{flex:1;width:100%;z-index:1;min-height:300px}
#lista{max-height:38vh;overflow-y:auto;background:#111;padding:10px}
.card{background:#1e1e1e;color:white;border-radius:12px;padding:12px;margin-bottom:10px}
.card h3{font-size:16px} .card p{font-size:13px;color:#ccc;margin-top:4px}
.badge{background:#ff6b00;color:white;font-size:11px;padding:3px 8px;border-radius:20px}
.btn{display:block;text-align:center;background:#25D366;color:white;padding:11px;border-radius:10px;text-decoration:none;font-weight:700;margin-top:8px}
.ruta{background:#fff;color:#111}
.dist{color:#4ade80;font-weight:700;font-size:13px}
#cercanaBanner{display:none;background:#00c853;color:white;padding:12px;text-align:center}
#cercanaBanner h2{font-size:17px}
#cercanaBanner p{font-size:13px;margin:4px 0}
#cercanaBanner a{display:inline-block;background:white;color:#111;padding:8px 14px;border-radius:20px;text-decoration:none;font-weight:700;margin-top:6px}
.borracho{font-size:38px;line-height:1;text-align:center;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
@keyframes bamboleo{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.borracho span{display:inline-block;animation:bamboleo 1s infinite}
.bote-cercana{position:relative;width:44px;height:44px}
.bote-cercana .onda{position:absolute;left:50%;top:50%;width:44px;height:44px;border:3px solid #ff6b00;border-radius:50%;transform:translate(-50%,-50%);animation:pulso 1.2s infinite}
.bote-cercana .emoji{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:32px}
@keyframes pulso{0%{transform:translate(-50%,-50%) scale(.6);opacity:1}100%{transform:translate(-50%,-50%) scale(1.4);opacity:0}}
.bote-normal{font-size:32px;line-height:1;text-align:center}
</style>
</head>
<body>
<header>
<h1>🍹 Tu Romo Aquí</h1>
<p>📍 Licorerías cerca de ti en Santo Domingo</p>
<input id="search" placeholder="🔍 Buscar tienda, zona...">
<div id="filters">
<button class="on" data-f="Todos">Todos</button>
<button data-f="Romo">Romo</button>
<button data-f="Cerveza">Cerveza</button>
<button data-f="Vino">Vino</button>
<button data-f="Cercana">📍 Más Cercana</button>
</div>
</header>
<div id="cercanaBanner"></div>
<div id="map"></div>
<div id="lista"><p style="color:#aaa;text-align:center">Cargando tiendas...</p></div>
<script>
let map = L.map('map').setView([18.4861,-69.9312],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
let tiendas=[], markers=[], userLat=null, userLng=null, filtro='Todos', busqueda='';
function distKm(lat1,lon1,lat2,lon2){let R=6371,dLa=(lat2-lat1)*Math.PI/180,dLo=(lon2-lon1)*Math.PI/180,a=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLo/2)*Math.sin(dLo/2);return R*(2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)))}
function getCercana(){ if(!userLat || !tiendas.length) return null; let c=null,md=1e9; tiendas.forEach(t=>{let d=distKm(userLat,userLng,t.lat,t.lng); if(d<md){md=d;c=t}}); return c; }
function mostrarCercana(){
  let cercana = getCercana(); if(!cercana) return;
  let d = distKm(userLat,userLng,cercana.lat,cercana.lng);
  let banner = document.getElementById('cercanaBanner');
  banner.style.display='block';
  banner.innerHTML = '<h2>⭐ TU LICORERÍA MÁS CERCANA</h2><p><b>'+cercana.name+'</b> - a '+d.toFixed(1)+' km - '+cercana.zona+'</p><p>'+(estaAbierta(cercana)?'🟢 ABIERTA AHORA':'🔴 CERRADA AHORA')+' - '+cercana.hora+'</p><a href="https://www.google.com/maps/dir/?api=1&destination='+cercana.lat+','+cercana.lng+'" target="_blank">🧭 Cómo llegar</a>';
}
function estaAbierta(t){
  if(!t.horario) return true;
  let ahora = new Date();
  let dia = ahora.getDay();
  let hora = ahora.getHours() + ahora.getMinutes()/60;
  if(dia>=1 && dia<=5) return hora>=t.horario.lun_vie_abre && hora < t.horario.lun_vie_cierra;
  if(dia==6) return hora>=t.horario.sab_abre;
  if(dia==0){
    if(hora < 2) return true;
    return hora>=t.horario.dom_abre && hora < t.horario.dom_cierra;
  }
  return true;
}
function render(){
  markers.forEach(m=>map.removeLayer(m)); markers=[];
  let lista = tiendas.filter(t=>{
    if(filtro!=='Todos' && filtro!=='Cercana' && !t.bebidas.includes(filtro)) return false;
    if(busqueda && !(t.name+' '+t.zona+' '+t.bebidas.join(' ')).toLowerCase().includes(busqueda)) return false;
    return true;
  });
  if(filtro==='Cercana' && userLat){ lista.sort((a,b)=>distKm(userLat,userLng,a.lat,a.lng)-distKm(userLat,userLng,b.lat,b.lng)); }
  document.getElementById('lista').innerHTML = lista.length? '':'<p style="color:#aaa;text-align:center">No hay tiendas con ese filtro</p>';
  let cercana = getCercana();
  lista.forEach(t=>{
    let d = userLat? distKm(userLat,userLng,t.lat,t.lng):null;
    let esCercana = cercana && t.name===cercana.name;
    let abierta = estaAbierta(t);
    let m;
    if(esCercana && abierta){
      let iconoBoteParpadea = L.divIcon({className:'',html:'<div class="bote-cercana"><div class="onda"></div><div class="emoji">🍾</div></div>',iconSize:[44,44],iconAnchor:[22,22]});
      m = L.marker([t.lat,t.lng],{icon:iconoBoteParpadea});
      m.bindPopup('<b>⭐ LA MÁS CERCANA A TI</b><br><b>'+t.name+'</b><br>🟢 ABIERTA AHORA<br>'+t.hora+'<br><a href="https://wa.me/1'+t.tel+'">WhatsApp</a>');
    } else {
      let iconoBoteNormal = L.divIcon({className:'',html:'<div class="bote-normal">🍾</div>',iconSize:[32,32],iconAnchor:[16,16]});
      m = L.marker([t.lat,t.lng],{icon:iconoBoteNormal});
      m.bindPopup('<b>'+t.name+'</b><br>'+(abierta?'🟢 ABIERTA AHORA':'🔴 CERRADA AHORA')+'<br>'+t.hora+'<br><a href="https://wa.me/1'+t.tel+'">WhatsApp</a>');
    }
    m.on('click',()=>{ setTimeout(()=>{ window.open('https://www.google.com/maps/dir/?api=1&destination='+t.lat+','+t.lng,'_blank'); },400); });
    markers.push(m); m.addTo(map);
    document.getElementById('lista').innerHTML += '<div class="card"><h3>'+t.name+' '+(esCercana?'⭐': '')+'</h3><p>'+t.zona+' '+(d!==null?' - <span class="dist">'+d.toFixed(1)+' km</span>':'')+'</p><p>'+(abierta?'🟢 ABIERTA AHORA':'🔴 CERRADA AHORA')+' - '+t.hora+'</p><p>🍹 '+t.bebidas.join(', ')+'</p><a class="btn" href="https://wa.me/1'+t.tel+'">💬 Pedir por WhatsApp</a><a class="btn ruta" href="https://www.google.com/maps/dir/?api=1&destination='+t.lat+','+t.lng+'" target="_blank">🧭 Cómo llegar</a></div>';
  });
}
fetch('tiendas.json').then(r=>r.json()).then(d=>{tiendas=d;render();mostrarCercana();});
document.getElementById('search').addEventListener('input',e=>{busqueda=e.target.value.toLowerCase();render();});
document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('on'));b.classList.add('on');filtro=b.dataset.f;render();mostrarCercana();}));
if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>{
  userLat=p.coords.latitude; userLng=p.coords.longitude;
  map.setView([userLat,userLng],14);
  let iconoBorracho = L.divIcon({className:'',html:'<div class="borracho"><span>🥴</span></div>',iconSize:[38,38],iconAnchor:[19,19]});
  L.marker([userLat,userLng],{icon:iconoBorracho}).addTo(map);
  render(); mostrarCercana();
},()=>{alert('Activa tu ubicación para ver la licorería más cercana');});
}
</script>
</body>
</html>
